name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Tests
        run: npm test -- --runInBand

      - name: Verify installed Router parser path
        run: npm run test:router-parser

  database:
    name: Database authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Docker
        run: docker version

      - name: Start local Supabase
        # Test the allowlist, then capture startup without printing privileged output.
        run: |
          node --test scripts/__tests__/supabase-start-diagnostics.test.mjs
          node scripts/start-supabase-ci.mjs

      - name: Reset local database
        run: npm run db:reset

      - name: Test database authorization
        run: npm run db:test

      - name: Test savings write concurrency
        run: node scripts/test-savings-concurrency.mjs

      - name: Test household authorization concurrency
        run: node scripts/test-household-concurrency.mjs

      - name: Test invitation lifecycle concurrency
        run: node scripts/test-invitation-concurrency.mjs

      - name: Test default split concurrency
        run: node scripts/test-split-concurrency.mjs

      - name: Test authenticated personal finance journey
        run: npm run test:finance-api

      - name: Test authenticated invitation journey
        run: node scripts/test-invitation-flow.mjs

      - name: Generate database types
        run: npm run db:types

      - name: Upload generated database types
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: src/infrastructure/supabase/database.types.ts
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated database types are committed
        run: git diff --exit-code -- src/infrastructure/supabase/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
